<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HortaMon — Galeria de Cartas Colecionáveis</title>
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='14' y='34' width='36' height='22' rx='6' fill='%23d97706' stroke='%232b1d14' stroke-width='4'/%3E%3Crect x='10' y='28' width='44' height='10' rx='4' fill='%23f59e0b' stroke='%232b1d14' stroke-width='4'/%3E%3Cpath d='M32 28 C32 14 18 10 14 18 C12 24 24 28 32 28 Z' fill='%2322c55e' stroke='%232b1d14' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M32 28 C32 12 46 8 50 16 C52 22 40 28 32 28 Z' fill='%234ade80' stroke='%232b1d14' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E"
  />
  <script defer src="js/data/types.js"></script>
  <script defer src="js/data/moves.js"></script>
  <script defer src="js/data/species.js?v=2.4"></script>
  <script defer src="js/data/animal-art.js"></script>
  <script defer src="js/engine/sprites.js?v=2.4"></script>
  <script defer src="js/engine/save.js?v=2.4"></script>
  <style>
    :root {
      --ink: #25332e;
      --ink-soft: #526058;
      --cream: #f0eee5;
      --cream-warm: #e7e6dc;
      --leaf: #22c55e;
      --leaf-dark: #15803d;
      --sun: #facc15;
      --wood: #8b5a2b;
      --font-main: system-ui, 'Segoe UI', sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: var(--font-main);
      color: var(--ink);
      background: #192b26;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      background-attachment: fixed;
    }

    .page-wrap {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 18px 20px 30px;
    }

    /* Cabeçalho interativo */
    .gallery-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 12px 18px;
      margin-bottom: 14px;
      background: var(--cream);
      border: 1px solid #7c8e7e;
      border-radius: 8px;
    }

    .brand-block {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-title {
      margin: 0;
      font-size: 1.65rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.01em;
    }

    .brand-horta {
      color: #3c624b;
    }

    .brand-mon {
      color: #8c6638;
    }

    .brand-sub {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 11px;
      border-radius: 999px;
      background: #dcfce7;
      border: 2px solid var(--ink);
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--leaf-dark);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      border-radius: 12px;
      border: 2.5px solid var(--ink);
      box-shadow: 0 3px 0 var(--ink);
      background: var(--cream);
      color: var(--ink);
      font-family: inherit;
      font-weight: 800;
      font-size: 0.84rem;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--ink);
    }

    .btn-primary {
      background: linear-gradient(180deg, #4ade80 0%, #22c55e 100%);
      color: #ffffff;
      text-shadow: 0 1px 0 rgba(43, 29, 20, 0.45);
    }

    /* Barra de filtros por tipo */
    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
      padding: 10px 14px;
      background: rgba(255, 253, 245, 0.92);
      border: 3px solid var(--ink);
      border-radius: 16px;
      box-shadow: 0 4px 0 var(--ink);
    }

    .filter-pills {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
    }

    .filter-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 2.5px solid var(--ink);
      box-shadow: 0 2.5px 0 var(--ink);
      background: var(--cream);
      color: var(--ink);
      font-family: inherit;
      font-weight: 800;
      font-size: 0.82rem;
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.1s ease;
    }

    .filter-btn:hover {
      transform: translateY(-1px);
    }

    .filter-btn.active {
      background: var(--f-bg, #fde047);
      color: var(--f-color, var(--ink));
      box-shadow: 0 1px 0 var(--ink);
      transform: translateY(1px);
    }

    .filter-count {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--ink-soft);
    }

    /* Banner limpo exclusivo do modo ?sheet= */
    .sheet-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 7px 16px;
      margin-bottom: 12px;
      background: linear-gradient(180deg, #fffdf5 0%, #fef3c7 100%);
      border: 3px solid var(--ink);
      border-radius: 14px;
      box-shadow: 0 4px 0 var(--ink);
      height: 46px;
    }

    .sheet-banner-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sheet-logo {
      font-size: 1.32rem;
      font-weight: 900;
      letter-spacing: -0.01em;
    }

    .sheet-subtitle {
      font-size: 0.86rem;
      font-weight: 800;
      color: var(--wood);
    }

    .sheet-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 12px;
      border-radius: 999px;
      background: #dcfce7;
      border: 2px solid var(--ink);
      font-size: 0.82rem;
      font-weight: 900;
      color: var(--leaf-dark);
    }

    /* =====================================================================
       GRADE E CARTAS GIRATÓRIAS
       Frente: só o personagem. Verso: a ficha. Toque/clique para virar.
    ===================================================================== */
    .cards-grid {
      --card-w: 228px;
      display: grid;
      grid-template-columns: repeat(auto-fill, var(--card-w));
      justify-content: center;
      gap: 24px 20px;
    }

    .cards-grid.family-gallery {
      grid-template-columns: minmax(0, 1030px);
      gap: 30px;
    }
    .family-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(5px, 2vw, 20px);
    }
    .family-row figure { margin: 0; min-width: 0; }
    .family-row .tcard { width: 100%; }
    .family-row figcaption {
      margin-top: 8px;
      text-align: center;
      font-size: clamp(0.7rem, 2vw, 0.95rem);
      color: #e5ede3;
    }

    .tcard {
      position: relative;
      width: var(--card-w);
      aspect-ratio: 5 / 7;
      perspective: 1200px;
      container-type: inline-size;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .flip-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.3, 0.85, 0.25, 1);
    }

    .tcard.flipped .flip-inner {
      transform: rotateY(180deg);
    }

    @media (hover: hover) {
      .tcard:not(.static):hover .flip-inner {
        transform: translateY(-5px);
      }
      .tcard.flipped:not(.static):hover .flip-inner {
        transform: translateY(-5px) rotateY(180deg);
      }
    }

    .tcard:focus-visible .face {
      outline: 3px solid #2563eb;
      outline-offset: 3px;
    }

    .face {
      position: absolute;
      inset: 0;
      border-radius: 6cqw;
      border: 3px solid var(--ink);
      box-shadow: 0 5px 0 var(--ink);
      overflow: hidden;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }

    .face-back {
      transform: rotateY(180deg);
    }

    /* ---------- Frente ---------- */
    .face-front {
      background: var(--t-color);
      padding: 5cqw;
    }

    .front-window {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 3.5cqw;
      border: 2.5px solid var(--ink);
      background: radial-gradient(circle at 50% 44%, #fffdf5 0%, var(--t-bg) 52%, var(--t-color) 135%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Textura de pontinhos, como papel de carta impressa */
    .front-window::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(var(--t-dark) 1px, transparent 1.3px);
      background-size: 9px 9px;
      opacity: 0.06;
    }

    /* Brilho que acompanha o mouse */
    .front-window::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at var(--mx, 30%) var(--my, 20%), rgba(255, 255, 255, 0.55), transparent 48%);
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }

    @media (hover: hover) {
      .tcard:hover .front-window::after {
        opacity: 1;
      }
    }

    .front-window img {
      position: relative;
      width: 100%;
      height: auto;
    }

    .flip-hint {
      position: absolute;
      right: 7cqw;
      bottom: 6cqw;
      font-size: 7cqw;
      font-weight: 900;
      line-height: 1;
      color: var(--ink);
      opacity: 0.3;
    }

    /* Dourado: moldura de ouro + película holográfica */
    .tcard.golden .face-front {
      background: linear-gradient(135deg, #fde68a 0%, #f59e0b 35%, #fef3c7 52%, #d97706 78%, #fcd34d 100%);
    }

    .foil {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(115deg, transparent 20%, rgba(255, 0, 128, 0.35) 32%, rgba(255, 230, 0, 0.35) 42%,
        rgba(0, 255, 170, 0.35) 52%, rgba(0, 170, 255, 0.35) 62%, transparent 75%);
      background-size: 250% 250%;
      mix-blend-mode: color-dodge;
      opacity: 0.55;
      animation: foilMove 5s ease-in-out infinite alternate;
    }

    @keyframes foilMove {
      from { background-position: 0% 0%; }
      to { background-position: 100% 100%; }
    }

    /* ---------- Verso ---------- */
    .face-back {
      display: flex;
      flex-direction: column;
      background: #fffdf5;
      font-size: clamp(9px, 5.3cqw, 13px);
    }

    .back-head {
      display: flex;
      align-items: center;
      gap: 0.55em;
      padding: 0.6em 0.75em 0.55em;
      background: var(--t-bg);
      border-bottom: 2.5px solid var(--ink);
    }

    .back-thumb {
      flex: none;
      width: 2.7em;
      height: 2.7em;
      border: 2px solid var(--ink);
      border-radius: 0.6em;
      background: #fffdf5;
      overflow: hidden;
    }

    .back-thumb img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .back-names {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .back-name {
      margin: 0;
      font-size: 1.28em;
      font-weight: 900;
      line-height: 1.05;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .back-title {
      font-size: 0.78em;
      font-weight: 700;
      color: var(--ink-soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .back-num {
      margin-left: auto;
      align-self: flex-start;
      font-size: 0.82em;
      font-weight: 900;
      color: var(--t-dark);
    }

    .back-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 0.5em;
      padding: 0.6em 0.8em 0.75em;
    }

    .back-meta {
      font-size: 0.8em;
      font-weight: 800;
      color: var(--t-dark);
    }

    .stat-list {
      display: grid;
      grid-template-columns: 2.3em 1.8em 1fr;
      align-items: center;
      gap: 0.28em 0.45em;
      font-size: 0.82em;
      font-weight: 800;
    }

    .stat-list .lbl {
      color: var(--ink-soft);
    }

    .stat-list .val {
      text-align: right;
    }

    .stat-bar {
      height: 0.6em;
      border: 1.5px solid var(--ink);
      border-radius: 99px;
      background: #efe7d2;
      overflow: hidden;
    }

    .stat-bar i {
      display: block;
      height: 100%;
      background: var(--t-color);
    }

    .back-label {
      padding-top: 0.45em;
      border-top: 1.5px dashed rgba(43, 29, 20, 0.28);
      font-size: 0.68em;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .move-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.3em;
      font-size: 0.8em;
      font-weight: 800;
    }

    .move-list li {
      display: grid;
      grid-template-columns: 0.6em 1fr auto 2em;
      align-items: center;
      gap: 0.45em;
    }

    .mv-dot {
      width: 0.6em;
      height: 0.6em;
      border-radius: 50%;
      border: 1.5px solid var(--ink);
    }

    .mv-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mv-lv {
      font-weight: 700;
      color: var(--ink-soft);
    }

    .mv-pwr {
      text-align: right;
    }

    .matchups {
      display: flex;
      flex-direction: column;
      gap: 0.3em;
      font-size: 0.76em;
      font-weight: 800;
    }

    .matchups > div {
      display: flex;
      align-items: center;
      gap: 0.5em;
      flex-wrap: wrap;
    }

    .mu-lbl {
      min-width: 6.6em;
      color: var(--ink-soft);
      font-weight: 700;
    }

    .mu-type {
      display: inline-flex;
      align-items: center;
      gap: 0.3em;
    }

    .back-desc {
      margin: auto 0 0;
      font-size: 0.74em;
      font-weight: 600;
      font-style: italic;
      line-height: 1.3;
      color: var(--ink-soft);
    }

    .back-gold {
      font-size: 0.74em;
      font-weight: 900;
      color: #a16207;
    }

    @container (max-width: 205px) {
      .back-desc {
        display: none;
      }
    }

    /* ---------- Cartas bloqueadas ---------- */
    .tcard.locked {
      --t-color: #a8a29e;
      --t-bg: #f5f5f4;
      --t-dark: #57534e;
    }

    .tcard.locked .front-window {
      background: radial-gradient(circle at 50% 44%, #fafaf9 0%, #e7e5e4 70%);
    }

    .tcard.locked .front-window img {
      opacity: 0.85;
    }

    .locked-q {
      position: relative;
      font-size: 34cqw;
      font-weight: 900;
      color: rgba(43, 29, 20, 0.2);
    }

    .locked-msg {
      margin: auto 0;
      text-align: center;
      font-size: 0.9em;
      font-weight: 800;
      line-height: 1.35;
      color: var(--ink-soft);
    }

    /* ---------- Cabeçalho da coleção ---------- */
    .collect-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-weight: 800;
      font-size: 0.85rem;
      color: var(--ink-soft);
    }

    .collect-track {
      width: 160px;
      height: 12px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: #fff;
      overflow: hidden;
    }

    .collect-fill {
      display: block;
      height: 100%;
      background: var(--leaf);
    }

    .filter-tools {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .show-all-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      font-size: 0.82rem;
      cursor: pointer;
    }

    @media (max-width: 560px) {
      .page-wrap {
        padding: 10px 10px 24px;
      }
      .cards-grid {
        --card-w: calc((100vw - 34px) / 2);
        gap: 16px 12px;
      }
      .family-row {
        grid-template-columns: minmax(0, 270px);
        justify-content: center;
        gap: 20px;
      }
      .filter-bar {
        gap: 8px;
      }
    }

    /* =====================================================================
       MODO ?sheet=N (folha para imprimir/recortar: frente e verso lado a lado,
       é só recortar o par, dobrar no meio e colar)
    ===================================================================== */
    body.sheet-mode {
      background: #fdf8e7;
      overflow: hidden;
    }

    body.sheet-mode::before {
      opacity: 0.1;
    }

    body.sheet-mode .page-wrap {
      width: 1400px;
      height: 820px;
      max-width: 1400px;
      padding: 14px 18px;
      overflow: hidden;
    }

    body.sheet-mode .gallery-header,
    body.sheet-mode .filter-bar {
      display: none !important;
    }

    body.sheet-mode .sheet-banner {
      display: flex;
    }

    body.sheet-mode .cards-grid {
      --card-w: 236px;
      grid-template-columns: repeat(2, auto);
      gap: 22px 48px;
    }

    .print-pair {
      display: flex;
    }

    .tcard.static {
      cursor: default;
      perspective: none;
    }

    .tcard.static .face {
      transform: none;
      box-shadow: none;
    }

    .tcard.static .flip-hint {
      display: none;
    }

    .print-pair .tcard.static:first-child .face {
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
      border-right: 1.5px dashed var(--ink);
    }

    .print-pair .tcard.static:last-child .face {
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
      border-left: 1.5px dashed var(--ink);
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <header class="gallery-header">
      <div class="brand-block">
        <h1 class="brand-title">
          <span class="brand-horta">Horta</span><span class="brand-mon">Mon</span>
        </h1>
        <span id="brand-sub" class="brand-sub">🃏 Álbum de Cartas Colecionáveis</span>
      </div>
      <div class="header-actions">
        <a href="index.html" class="btn btn-primary">← Voltar ao jogo</a>
      </div>
    </header>

    <section class="filter-bar" aria-label="Filtrar cartas por tipo">
      <div id="filter-pills" class="filter-pills"></div>
      <div class="filter-tools">
        <span id="filter-count" class="filter-count"></span>
        <button id="flip-all" type="button" class="btn">↻ Virar todas</button>
        <label class="show-all-toggle"><input id="show-all" type="checkbox" /> Ver todas</label>
      </div>
    </section>

    <header id="sheet-banner" class="sheet-banner">
      <div class="sheet-banner-left">
        <span class="sheet-logo">
          🌱 <span class="brand-horta">Horta</span><span class="brand-mon">Mon</span>
        </span>
        <span class="sheet-subtitle">Coleção Completa de Cartas Botânicas</span>
      </div>
      <span id="sheet-pill" class="sheet-pill">Página 1/3 • #01–#08</span>
    </header>

    <main id="cards-grid" class="cards-grid" aria-live="polite"></main>
  </div>

  <script>
    (function () {
      'use strict';

      const PAIRS_PER_SHEET = 4;

      function escapeHtml(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function getSheetParam(pages) {
        try {
          const params = new URLSearchParams(window.location.search);
          const s = Math.floor(Number(params.get('sheet')));
          if (s >= 1 && s <= (pages || 1)) return s;
        } catch (_) {}
        return null;
      }

      function spriteUrl(HM, id, size, silhouette, golden) {
        return HM.Sprites && typeof HM.Sprites.renderCreatureToDataURL === 'function'
          ? HM.Sprites.renderCreatureToDataURL(id, size, !!silhouette, !!golden)
          : '';
      }

      function pickSignatureMoves(sp, HM) {
        const learnset = Array.isArray(sp.learnset) ? sp.learnset : [];
        const unique = [];
        const seen = new Set();
        learnset.forEach((entry) => {
          if (!entry || !entry.moveId || seen.has(entry.moveId)) return;
          if (!HM.MOVES || !HM.MOVES[entry.moveId]) return;
          seen.add(entry.moveId);
          unique.push(entry);
        });
        const nonBasic = unique.filter((e) => e.moveId !== 'investida');
        const pool = nonBasic.length >= 3 ? nonBasic : unique;
        if (pool.length <= 3) return pool;
        const picks = [pool[0], pool[Math.floor(pool.length / 2)], pool[pool.length - 1]];
        return picks.filter((m, i) => m && picks.indexOf(m) === i);
      }

      function getStageLabel(sp, HM) {
        const all = HM.SPECIES_LIST || [];
        const prev = all.find((other) => other.evolvesTo === sp.id);
        const next = sp.evolvesTo && HM.SPECIES && HM.SPECIES[sp.evolvesTo];
        const age = HM.LIFE_STAGES[sp.stage].label;
        if (next) return `${age} · evolui para ${next.name} no Nv. ${sp.evolveLevel}`;
        if (prev) return `${age} · evolução de ${prev.name}`;
        return 'Estágio único';
      }

      // Lê o save do jogo (mesmo navegador) para saber o que já foi visto/capturado
      function readCollection() {
        const out = { hasSave: false, seen: {}, caught: {}, golden: {} };
        try {
          const st = window.HortaMon.loadGame();
          if (!st || !st.dex) return out;
          out.hasSave = true;
          out.seen = st.dex.seen || {};
          out.caught = st.dex.caught || {};
          (st.party || []).concat(st.box || []).forEach((c) => {
            if (c && c.golden) out.golden[c.speciesId] = true;
          });
        } catch (_) {}
        return out;
      }

      function typeOf(sp, HM) {
        return (HM.TYPES && HM.TYPES[sp.type]) || { name: sp.type, icon: '', color: '#22c55e', bg: '#dcfce7', dark: '#166534' };
      }

      function typeVars(t) {
        return `--t-color:${t.color};--t-bg:${t.bg};--t-dark:${t.dark};`;
      }

      // ---------------- Faces ----------------
      function frontFace(sp, HM, golden) {
        return `
          <div class="face face-front">
            <div class="front-window">
              <img src="${spriteUrl(HM, sp.id, 520, false, golden)}" alt="${escapeHtml(sp.name)}" draggable="false" />
              ${golden ? '<span class="foil"></span>' : ''}
              <span class="flip-hint" aria-hidden="true">↻</span>
            </div>
          </div>`;
      }

      // "Forte contra" / "Fraco contra" a partir da tabela de tipos
      function matchupLine(sp, HM) {
        const chart = HM.TYPE_CHART || {};
        const list = HM.TYPE_LIST || Object.keys(HM.TYPES || {});
        const strong = list.filter((d) => (chart[sp.type] || {})[d] >= 2);
        const weak = list.filter((a) => (chart[a] || {})[sp.type] >= 2);
        const names = (ids) =>
          ids
            .map((id) => {
              const t = HM.TYPES[id];
              return `<span class="mu-type"><span class="mv-dot" style="background:${t.color}"></span>${escapeHtml(t.name)}</span>`;
            })
            .join(' ');
        return `
          <div class="back-label">Tipos</div>
          <div class="matchups">
            <div><span class="mu-lbl">Forte contra</span>${names(strong)}</div>
            <div><span class="mu-lbl">Fraco contra</span>${names(weak)}</div>
          </div>`;
      }

      function backFace(sp, HM, golden) {
        const t = typeOf(sp, HM);
        const num = String(sp.dexNum || 0).padStart(3, '0');
        const bs = sp.baseStats || { hp: 50, atk: 50, def: 50, spd: 50 };
        const stat = (label, val) => {
          const pct = Math.max(8, Math.min(100, Math.round((val / 110) * 100)));
          return `<span class="lbl">${label}</span><span class="val">${val}</span><span class="stat-bar"><i style="width:${pct}%"></i></span>`;
        };
        const moves = pickSignatureMoves(sp, HM)
          .map((entry) => {
            const mv = HM.MOVES[entry.moveId];
            const mt = (HM.TYPES && HM.TYPES[mv.type]) || t;
            const pwr = mv.category === 'attack' ? mv.power : '—';
            return `<li title="${escapeHtml(mv.desc || '')}"><span class="mv-dot" style="background:${mt.color}"></span><span class="mv-name">${escapeHtml(mv.name)}</span><span class="mv-lv">Nv.${entry.level}</span><span class="mv-pwr">${pwr}</span></li>`;
          })
          .join('');
        return `
          <div class="face face-back">
            <header class="back-head">
              <span class="back-thumb"><img src="${spriteUrl(HM, sp.id, 72, false, golden)}" alt="" draggable="false" /></span>
              <span class="back-names">
                <h2 class="back-name">${escapeHtml(sp.name)}</h2>
                <span class="back-title">${escapeHtml(sp.title || '')}</span>
              </span>
              <span class="back-num">#${num}</span>
            </header>
            <div class="back-body">
              <div class="back-meta">${t.icon || ''} ${escapeHtml(t.name)} · ${escapeHtml(getStageLabel(sp, HM))}</div>
              <div class="stat-list">
                ${stat('HP', bs.hp)}${stat('ATK', bs.atk)}${stat('DEF', bs.def)}${stat('VEL', bs.spd)}
              </div>
              <div class="back-label">Golpes</div>
              <ul class="move-list">${moves}</ul>
              ${matchupLine(sp, HM)}
              ${golden ? '<div class="back-gold">✨ Você tem a versão Dourada</div>' : ''}
              <p class="back-desc">${escapeHtml(sp.desc || '')}</p>
            </div>
          </div>`;
      }

      function lockedFront(sp, HM, seen) {
        return `
          <div class="face face-front">
            <div class="front-window">
              ${seen ? `<img src="${spriteUrl(HM, sp.id, 520, true)}" alt="Silhueta" draggable="false" />` : '<span class="locked-q">?</span>'}
              <span class="flip-hint" aria-hidden="true">↻</span>
            </div>
          </div>`;
      }

      function lockedBack(sp, seen) {
        const num = String(sp.dexNum || 0).padStart(3, '0');
        return `
          <div class="face face-back">
            <header class="back-head">
              <span class="back-names">
                <h2 class="back-name">${seen ? escapeHtml(sp.name) : '???'}</h2>
                <span class="back-title">${seen ? 'Já visto na natureza' : 'Ainda desconhecido'}</span>
              </span>
              <span class="back-num">#${num}</span>
            </header>
            <div class="back-body">
              <p class="locked-msg">${seen ? 'Capture este HortaMon no jogo para liberar a carta.' : 'Procure na grama alta. Quem sabe ele aparece?'}</p>
            </div>
          </div>`;
      }

      function flipCard(sp, HM, opts) {
        const o = opts || {};
        const t = typeOf(sp, HM);
        const label = o.locked ? (o.seen ? sp.name : 'Carta bloqueada') : sp.name;
        const cls = ['tcard'];
        if (o.locked) cls.push('locked');
        if (o.golden) cls.push('golden');
        // Carta nunca vista fica cinza (não entrega o tipo); vista mostra a cor do tipo
        const style = o.locked && !o.seen ? '' : typeVars(t);
        return `
          <article class="${cls.join(' ')}" style="${style}" tabindex="0" role="button" aria-pressed="false" aria-label="${escapeHtml(label)} — toque para virar">
            <div class="flip-inner">
              ${o.locked ? lockedFront(sp, HM, o.seen) + lockedBack(sp, o.seen) : frontFace(sp, HM, o.golden) + backFace(sp, HM, o.golden)}
            </div>
          </article>`;
      }

      function printPair(sp, HM) {
        const t = typeOf(sp, HM);
        return `
          <div class="print-pair">
            <div class="tcard static" style="${typeVars(t)}">${frontFace(sp, HM, false)}</div>
            <div class="tcard static" style="${typeVars(t)}">${backFace(sp, HM, false)}</div>
          </div>`;
      }

      // ---------------- Interação ----------------
      function toggle(card) {
        const flipped = card.classList.toggle('flipped');
        card.setAttribute('aria-pressed', flipped ? 'true' : 'false');
      }

      function bindCards(grid) {
        grid.addEventListener('click', (ev) => {
          const card = ev.target.closest('.tcard:not(.static)');
          if (card) toggle(card);
        });
        grid.addEventListener('keydown', (ev) => {
          if (ev.key !== 'Enter' && ev.key !== ' ') return;
          const card = ev.target.closest('.tcard:not(.static)');
          if (!card) return;
          ev.preventDefault();
          toggle(card);
        });
        grid.addEventListener('pointermove', (ev) => {
          const card = ev.target.closest('.tcard');
          if (!card || ev.pointerType !== 'mouse') return;
          const r = card.getBoundingClientRect();
          card.style.setProperty('--mx', `${Math.round(((ev.clientX - r.left) / r.width) * 100)}%`);
          card.style.setProperty('--my', `${Math.round(((ev.clientY - r.top) / r.height) * 100)}%`);
        });
      }

      async function init() {
        const HM = window.HortaMon;
        if (!HM || !Array.isArray(HM.SPECIES_LIST)) return;
        await HM.Sprites.artReady;

        const grid = document.getElementById('cards-grid');
        const filterPills = document.getElementById('filter-pills');
        const filterCount = document.getElementById('filter-count');
        const sheetPill = document.getElementById('sheet-pill');
        const total = HM.SPECIES_LIST.length;

        // Modo folha para imprimir: pares frente|verso
        const pages = Math.ceil(total / PAIRS_PER_SHEET);
        const sheet = getSheetParam(pages);
        if (sheet) {
          document.body.classList.add('sheet-mode', `sheet-${sheet}`);
          const start = (sheet - 1) * PAIRS_PER_SHEET;
          const end = Math.min(total, start + PAIRS_PER_SHEET);
          const pad = (n) => String(n).padStart(3, '0');
          sheetPill.textContent = `Folha ${sheet}/${pages} • #${pad(start + 1)}–#${pad(end)} • recorte, dobre e cole`;
          grid.innerHTML = HM.SPECIES_LIST.slice(start, end).map((sp) => printPair(sp, HM)).join('');
          return;
        }

        const col = readCollection();
        const showAllBox = document.getElementById('show-all');
        const flipAllBtn = document.getElementById('flip-all');
        const brandSub = document.getElementById('brand-sub');
        const caughtCount = HM.SPECIES_LIST.filter((sp) => col.caught[sp.id]).length;
        if (col.hasSave) {
          const pct = Math.round((caughtCount / total) * 100);
          brandSub.innerHTML = `<span class="collect-bar">Sua coleção: ${caughtCount}/${total} <span class="collect-track"><span class="collect-fill" style="width:${pct}%"></span></span></span>`;
        } else {
          brandSub.textContent = `${total} cartas para colecionar — jogue para liberar as suas`;
        }

        const galleryType = new URLSearchParams(location.search).get('galeria');
        let activeType = (HM.TYPE_LIST || []).includes(galleryType) ? galleryType : 'all';
        const preview = galleryType === 'todas' || activeType !== 'all';
        let allFlipped = false;

        function renderFilters() {
          const btns = [
            `<button type="button" class="filter-btn${activeType === 'all' ? ' active' : ''}" data-type="all" style="--f-bg:#fde047;--f-color:#2b1d14;">Todas (${total})</button>`
          ];
          (HM.TYPE_LIST || []).forEach((tid) => {
            const t = HM.TYPES[tid];
            const count = HM.SPECIES_LIST.filter((sp) => sp.type === tid).length;
            btns.push(
              `<button type="button" class="filter-btn${activeType === tid ? ' active' : ''}" data-type="${escapeHtml(tid)}" style="--f-bg:${t.bg};--f-color:${t.dark};">${t.icon} ${escapeHtml(t.name)} (${count})</button>`
            );
          });
          filterPills.innerHTML = btns.join('');
          filterPills.querySelectorAll('[data-type]').forEach((btn) => {
            btn.addEventListener('click', () => {
              activeType = btn.getAttribute('data-type');
              renderFilters();
              renderCards();
            });
          });
        }

        function renderCards() {
          const list = activeType === 'all' ? HM.SPECIES_LIST : HM.SPECIES_LIST.filter((sp) => sp.type === activeType);
          const showAll = !!(showAllBox && showAllBox.checked);
          const unlocked = list.filter((sp) => col.caught[sp.id]).length;
          filterCount.textContent = showAll ? `${list.length} cartas (modo galeria)` : `Liberadas: ${unlocked} de ${list.length}`;
          function cardFor(sp) {
            const open = showAll || col.caught[sp.id];
            return flipCard(sp, HM, {
              locked: !open,
              seen: !!col.seen[sp.id],
              golden: open && !!col.golden[sp.id]
            });
          }
          grid.classList.toggle('family-gallery', showAll);
          if (showAll) {
            grid.innerHTML = list.filter(sp => sp.stage === 1).map(first => {
              const cards = [];
              for (let sp = first; sp; sp = HM.SPECIES[sp.evolvesTo]) {
                cards.push(`<figure>${cardFor(sp)}<figcaption><strong>${escapeHtml(sp.name)}</strong> · ${HM.LIFE_STAGES[sp.stage].label}</figcaption></figure>`);
              }
              return `<section class="family-row" aria-label="Família de ${escapeHtml(first.name)}">${cards.join('')}</section>`;
            }).join('');
          } else {
            grid.innerHTML = list.map(cardFor).join('');
          }
          if (allFlipped) grid.querySelectorAll('.tcard').forEach((c) => toggle(c));
        }

        if (showAllBox) {
          showAllBox.checked = preview;
          showAllBox.addEventListener('change', renderCards);
        }
        if (flipAllBtn) {
          flipAllBtn.addEventListener('click', () => {
            allFlipped = !allFlipped;
            grid.querySelectorAll('.tcard').forEach((c) => {
              if (c.classList.contains('flipped') !== allFlipped) toggle(c);
            });
          });
        }

        bindCards(grid);
        renderFilters();
        renderCards();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
